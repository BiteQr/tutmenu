function renderQR(url, holderId = 'qrHolder') {
  const holder = document.getElementById(holderId);
  if (!holder) return;
  holder.innerHTML = '';
  if (typeof QRCode === 'undefined') { holder.innerHTML = '<p class="empty-hint">QR-библиотека не загрузилась — проверь интернет и обнови страницу</p>'; return; }
  new QRCode(holder, { text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
}

/** QR в SVG для Figma: вектор, прозрачный фон, только чёрные модули (без белой рамки) */
function downloadQRSvg(url, kind = 'menu') {
  if (typeof QRCode === 'undefined') { toast('QR-библиотека не загрузилась'); return; }
  const qr = new QRCode(document.createElement('div'), { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  const m = qr._oQRCode;
  if (!m) { toast('Не получилось создать QR-код'); return; }
  const n = m.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!m.isDark(r, c)) continue;
      let w = 1; while (c + w < n && m.isDark(r, c + w)) w++; // склеиваем подряд идущие модули в одну полоску
      d += `M${c} ${r}h${w}v1h-${w}z`;
      c += w - 1;
    }
  }
  const size = n * 10;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="#000000" d="${d}"/></svg>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  a.download = `qr-${state.slug}-${kind === 'home' ? 'glavnyj-ekran' : 'menu'}.svg`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadQR(url, kind = 'menu') {
  if (typeof QRCode === 'undefined') { toast('QR-библиотека не загрузилась'); return; }
  const holder = document.createElement('div');
  new QRCode(holder, { text: url, width: 1000, height: 1000, correctLevel: QRCode.CorrectLevel.M });
  const canvas = holder.querySelector('canvas');
  if (!canvas) { toast('Не получилось создать QR-код для скачивания'); return; }
  // Белая рамка вокруг кода: без неё телефоны плохо считывают распечатанный QR на тёмном фоне
  const pad = 100;
  const out = document.createElement('canvas');
  out.width = canvas.width + pad * 2; out.height = canvas.height + pad * 2;
  const g = out.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(canvas, pad, pad);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `qr-${state.slug}-${kind === 'home' ? 'glavnyj-ekran' : 'menu'}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* =========================================================
   СЖАТИЕ ФОТО В БРАУЗЕРЕ
   Уменьшаем длинную сторону до maxSide и пережимаем в WebP (а где браузер
   не умеет кодировать WebP — например Safari — в JPEG). Если что-то пошло не
   так (формат, который браузер не открывает, вроде HEIC в Chrome), молча
   отдаём оригинал — загрузка не должна ломаться из-за сжатия.
   ========================================================= */
async function compressImage(file, maxSide = 1280) {
  try {
    if (!/^image\/(jpeg|png|webp|heic|heif|avif|bmp)$/i.test(file.type)) return file; // SVG/GIF не трогаем
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = reject;
      el.src = URL.createObjectURL(file);
    });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    URL.revokeObjectURL(img.src);
    if (!w0 || !h0) return file;
    // Уже маленькое и лёгкое — не пережимаем ещё раз, чтобы не терять качество зря
    if (Math.max(w0, h0) <= maxSide && file.size < 300 * 1024) return file;

    const scale = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.round(w0 * scale), h = Math.round(h0 * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);

    const toBlob = (type, q) => new Promise((r) => canvas.toBlob(r, type, q));
    let blob = await toBlob('image/webp', 0.8);
    if (!blob || blob.type !== 'image/webp') {
      // PNG может быть с прозрачностью (логотипы) — в JPEG она стала бы чёрным фоном
      if (file.type === 'image/png') return file;
      blob = await toBlob('image/jpeg', 0.82);
    }
    if (!blob || blob.size >= file.size) return file;
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const name = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.' + ext;
    return new File([blob], name, { type: blob.type });
  } catch {
    return file;
  }
}

/* =========================================================
   ПЕРЕКОДИРОВАНИЕ ВИДЕО В БРАУЗЕРЕ
   Видео с iPhone — это обычно HEVC в .mov и 4K: на многих Android и в Chrome оно не играет
   вовсе или грузится минутами. Прогоняем ролик через canvas + MediaRecorder и получаем
   обычный MP4 (H.264) до 1280px и ~2.5 Мбит/с — играет везде и весит в разы меньше.
   Попутно снимаем первый кадр как обложку. Перекодирование идёт в реальном времени
   (ролик 15 сек ≈ 15 сек). Если браузер не умеет писать MP4 или что-то сломалось —
   отдаём оригинал, загрузка не ломается.
   ========================================================= */
const VIDEO_MAX_SIDE = 1280;
const VIDEO_MAX_SECONDS = 90;

async function transcodeVideo(file, { onProgress, types } = {}) {
  let url, box;
  try {
    if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) return { file };
    const prefer = types || ['video/mp4;codecs=avc1.42E01F', 'video/mp4;codecs=avc1', 'video/mp4'];
    const mime = prefer.find((t) => MediaRecorder.isTypeSupported(t));

    url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    // ВАЖНО: Safari не обновляет кадры у видео, которое спрятано или вне экрана (экономит батарею) —
    // тогда в запись попадает одна застывшая картинка. Поэтому на время обработки показываем
    // видео в маленьком окошке в углу экрана, реально видимым.
    box = document.createElement('div');
    box.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:10000;width:220px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.2);font:13px/1.3 -apple-system,system-ui,sans-serif;color:#333;';
    box.innerHTML = '<div style="margin-bottom:6px;font-weight:600;">Готовлю видео…</div>';
    v.style.cssText = 'display:block;width:100%;height:auto;border-radius:8px;background:#000;';
    box.appendChild(v);
    document.body.appendChild(box);
    const once = (ev, ms = 20000) => new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout ' + ev)), ms);
      v.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
      v.addEventListener('error', () => { clearTimeout(t); rej(new Error('decode')); }, { once: true });
    });
    // iPhone не грузит видео, пока его не запустить (preload там игнорируется) — запускаем
    // без звука, ждём первые данные, ставим на паузу и возвращаемся в начало
    const loaded = once('loadeddata');
    v.play().catch(() => {});
    await loaded;
    v.pause();
    if (v.currentTime > 0.05) { const sk = once('seeked'); v.currentTime = 0; await sk; }
    const dur = v.duration;
    const vw = v.videoWidth, vh = v.videoHeight;
    if (!vw || !vh) throw new Error('no video track');

    const scale = Math.min(1, VIDEO_MAX_SIDE / Math.max(vw, vh));
    const w = Math.round((vw * scale) / 2) * 2, h = Math.round((vh * scale) / 2) * 2;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(v, 0, 0, w, h);
    const posterBlob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
    const poster = posterBlob ? new File([posterBlob], 'poster.jpg', { type: 'image/jpeg' }) : null;

    if (!mime || !isFinite(dur) || dur <= 0 || dur > VIDEO_MAX_SECONDS) return { file, poster };

    const stream = canvas.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2500000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { rec.onstop = r; });

    // Следим, что кадры реально меняются: берём крошечный отпечаток картинки раз в ~0.4 сек.
    // Если за весь ролик он не менялся — браузер отдавал застывший кадр, такой результат не берём.
    const probe = document.createElement('canvas');
    probe.width = 16; probe.height = 9;
    const pctx = probe.getContext('2d', { willReadFrequently: true });
    const prints = new Set();
    let lastProbe = -1;
    const fingerprint = () => {
      pctx.drawImage(canvas, 0, 0, 16, 9);
      const d = pctx.getImageData(0, 0, 16, 9).data;
      let hsh = 0;
      for (let i = 0; i < d.length; i += 4) hsh = (hsh * 31 + (d[i] >> 3) + (d[i + 1] >> 3) * 7 + (d[i + 2] >> 3) * 13) | 0;
      prints.add(hsh);
    };

    let raf = 0, stopDraw = false;
    const paint = () => {
      ctx.drawImage(v, 0, 0, w, h);
      onProgress?.(Math.min(1, v.currentTime / dur));
      if (v.currentTime - lastProbe >= 0.4) { lastProbe = v.currentTime; fingerprint(); }
    };
    // requestVideoFrameCallback — рисуем ровно когда пришёл новый кадр (есть в Safari и Chrome);
    // где его нет — обычный цикл по requestAnimationFrame
    const useRvfc = typeof v.requestVideoFrameCallback === 'function';
    const loopRvfc = () => { if (stopDraw) return; paint(); v.requestVideoFrameCallback(loopRvfc); };
    const loopRaf = () => { if (stopDraw) return; paint(); raf = requestAnimationFrame(loopRaf); };

    rec.start(1000);
    paint();
    await v.play();
    if (useRvfc) v.requestVideoFrameCallback(loopRvfc); else loopRaf();
    await once('ended', (dur + 20) * 1000);
    stopDraw = true;
    cancelAnimationFrame(raf);
    rec.stop();
    await stopped;

    if (dur > 1.5 && prints.size < 2) return { file, poster, frozen: true }; // кадры не менялись — берём оригинал

    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    if (blob.size < 10 * 1024) return { file, poster }; // что-то пошло не так — лучше оригинал
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const out = new File([blob], (file.name || 'video').replace(/\.[^.]+$/, '') + '.' + ext, { type: blob.type });
    return { file: out, poster };
  } catch {
    return { file };
  } finally {
    box?.remove();
    if (url) URL.revokeObjectURL(url);
  }
}

/** HEVC (H.265) с iPhone бывает и в .mp4 — ищем в файле метку кодека hvc1/hev1 */
async function isHevc(blob) {
  try {
    const b = new Uint8Array(await blob.arrayBuffer());
    for (let i = 0; i < b.length - 4; i++) {
      if (b[i] === 0x68 && ((b[i + 1] === 0x76 && b[i + 2] === 0x63 && b[i + 3] === 0x31) || (b[i + 1] === 0x65 && b[i + 2] === 0x76 && b[i + 3] === 0x31))) return true;
    }
  } catch { /* ignore */ }
  return false;
}

/** Разово пережать уже загруженные фото (блюда, категории, акции, фон). Новое фото
 *  загружается рядом, в записи меняется ссылка; если сжатие не дало выигрыша — запись не трогаем. */
async function recompressExistingPhotos(onProgress) {
  const jobs = [];
  const isOurs = (u) => typeof u === 'string' && /\/files\//.test(u);
  state.menuItems.forEach((r) => isOurs(r.image) && jobs.push({ endpoint: 'menu-items', id: r.id, field: 'image', url: r.image }));
  state.categories.forEach((r) => isOurs(r.image) && jobs.push({ endpoint: 'categories', id: r.id, field: 'image', url: r.image }));
  state.promos.forEach((r) => isOurs(r.image) && jobs.push({ endpoint: 'promos', id: r.id, field: 'image', url: r.image }));
  if (isOurs(state.settings.bg_image)) jobs.push({ endpoint: 'restaurants', field: 'bg_image', url: state.settings.bg_image, maxSide: 2000 });
  // Видео: перекодируем .mov (почти всегда HEVC с iPhone) и всё тяжелее 8 МБ
  const videoJobs = [];
  state.promos.forEach((r) => isOurs(r.video) && videoJobs.push({ endpoint: 'promos', id: r.id, field: 'video', posterField: r.image ? null : 'image', url: r.video }));
  if (isOurs(state.settings.bg_video)) videoJobs.push({ endpoint: 'restaurants', field: 'bg_video', posterField: state.settings.bg_image ? null : 'bg_image', url: state.settings.bg_video });

  let done = 0, shrunk = 0, savedBytes = 0;
  const total = jobs.length + videoJobs.length;
  const targetOf = (job) => job.endpoint === 'restaurants'
    ? `/restaurants?restaurant=${state.slug}`
    : `/${job.endpoint}/${job.id}?restaurant=${state.slug}`;
  const uploadFile = async (f) => {
    const form = new FormData();
    form.append('file', f);
    return (await api(`/upload?restaurant=${state.slug}`, { method: 'POST', body: form, isForm: true })).url;
  };

  for (const job of videoJobs) {
    try {
      const path = job.url.replace(/^https?:\/\/[^/]+/, '');
      const res = await fetch(path);
      if (res.ok) {
        const blob = await res.blob();
        const isMov = /\.mov$/i.test(path) || /quicktime/i.test(blob.type);
        if (isMov || blob.size > 8 * 1024 * 1024 || await isHevc(blob)) {
          const name = path.split('/').pop() || 'video.mp4';
          const r = await transcodeVideo(new File([blob], name, { type: blob.type || 'video/mp4' }), {
            onProgress: (x) => onProgress?.(done, total, `видео ${Math.round(x * 100)}%`)
          });
          const body = {};
          if (r.file.size !== blob.size || r.file.type !== blob.type) {
            body[job.field] = await uploadFile(r.file);
            shrunk++; savedBytes += Math.max(0, blob.size - r.file.size);
          }
          if (r.poster && job.posterField) body[job.posterField] = await uploadFile(await compressImage(r.poster, 1280));
          if (Object.keys(body).length) await api(targetOf(job), { method: 'PUT', body });
        }
      }
    } catch { /* одно битое видео не должно останавливать остальные */ }
    done++;
    onProgress?.(done, total);
  }

  for (const job of jobs) {
    try {
      // Берём файл с этого же домена: /files/... отдаёт тот же воркер на любом адресе
      const path = job.url.replace(/^https?:\/\/[^/]+/, '');
      const res = await fetch(path);
      if (res.ok) {
        const blob = await res.blob();
        if (blob.size > 300 * 1024) {
          const name = path.split('/').pop() || 'photo.jpg';
          const small = await compressImage(new File([blob], name, { type: blob.type }), job.maxSide || 1280);
          if (small.size < blob.size * 0.8) {
            await api(targetOf(job), { method: 'PUT', body: { [job.field]: await uploadFile(small) } });
            shrunk++; savedBytes += blob.size - small.size;
          }
        }
      }
    } catch { /* одно битое фото не должно останавливать остальные */ }
    done++;
    onProgress?.(done, total);
  }
  return { total, shrunk, savedMB: Math.round(savedBytes / 1024 / 1024) };
}

function openRecompressModal() {
  openModal('Сжать фото и видео', `
    <p style="font-size:14px;margin-bottom:10px;">Пройдусь по всем уже загруженным фото и видео: тяжёлые фото пережму, видео акций переделаю в формат, который играет на любом телефоне, и добавлю обложку. Новые файлы и так обрабатываются сами при загрузке.</p>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Не закрывай и не переключай вкладку, пока идёт процесс — это займёт несколько минут (видео перекодируется в реальном времени).</p>
    <p id="recompressProgress" style="font-size:14px;font-weight:600;"></p>
    <div class="form-actions">
      <button type="button" class="btn btn-outline" id="cancelBtn">Отмена</button>
      <button type="button" class="btn btn-dark" id="startRecompressBtn">Сжать</button>
    </div>`, () => {
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('startRecompressBtn').onclick = async () => {
      const btn = document.getElementById('startRecompressBtn');
      const cancel = document.getElementById('cancelBtn');
      btn.disabled = true; cancel.disabled = true;
      const prog = document.getElementById('recompressProgress');
      const r = await recompressExistingPhotos((d, t, extra) => { prog.textContent = `Обработано ${d} из ${t}…${extra ? ' (' + extra + ')' : ''}`; });
      await reloadTable('menuItems', 'menu-items');
      await reloadTable('categories', 'categories');
      await reloadTable('promos', 'promos');
      try { state.settings = (await api(`/restaurants?restaurant=${state.slug}`)).restaurant; } catch { /* ignore */ }
      closeModal();
      renderTab();
      toast(r.shrunk ? `Готово: обработано файлов — ${r.shrunk} из ${r.total}, сэкономлено ~${r.savedMB} МБ` : 'Всё уже лёгкое — сжимать нечего');
    };
  });
}

/* =========================================================
   ЗАГРУЗКА ФОТО / ВИДЕО (drag&drop) + вставка готовой ссылки
   ========================================================= */
function uploaderHTML(key, url, kind) {
  const isVideo = kind === 'video';
  const preview = url
    ? (isVideo ? `<video src="${esc(url)}" muted></video>` : `<img src="${esc(url)}">`)
    : `<div class="ph">${isVideo ? 'видео' : 'фото'}</div>`;
  const sizeHint = isVideo ? 'до 60 МБ' : 'до 20 МБ';
  return `
    <div class="uploader" id="u_${key}">
      ${preview}
      <span class="txt">Перетащи файл сюда или нажми, чтобы выбрать (${sizeHint})</span>
      ${url ? `<button type="button" class="clear" data-clear>Убрать</button>` : ''}
      <input type="file" accept="${isVideo ? 'video/*' : 'image/*'}" id="f_${key}" data-url="${esc(url || '')}">
    </div>
    <div class="url-fallback">
      <label>Или вставь готовую ссылку${isVideo ? ' на видео (.mp4)' : ' на фото'}</label>
      <input type="text" id="url_${key}" placeholder="https://..." value="${esc(url || '')}">
    </div>
    <p class="uploader-err" id="err_${key}" hidden></p>`;
}

function attachUploader(rawKey, kind) {
  const wrap = document.getElementById('u_' + rawKey);
  const input = document.getElementById('f_' + rawKey);
  const urlInput = document.getElementById('url_' + rawKey);
  const errEl = document.getElementById('err_' + rawKey);
  if (!wrap || !input) return;

  const showError = (msg) => { if (errEl) { errEl.textContent = msg; errEl.hidden = false; } };
  const clearError = () => { if (errEl) errEl.hidden = true; };

  /** Показать/убрать превью и кнопку «Убрать» — используется и после загрузки файла, и после вставки ссылки */
  function setPreview(url) {
    input.dataset.url = url || '';
    if (urlInput) urlInput.value = url || '';
    wrap.querySelector('img,video')?.remove();
    wrap.querySelector('.ph')?.remove();
    wrap.querySelector('[data-clear]')?.remove();

    if (url) {
      const el = document.createElement(kind === 'video' ? 'video' : 'img');
      el.src = url;
      if (kind === 'video') el.muted = true;
      wrap.insertBefore(el, wrap.firstChild);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'clear'; btn.textContent = 'Убрать'; btn.dataset.clear = '1';
      btn.onclick = (e) => { e.preventDefault(); setPreview(''); };
      wrap.appendChild(btn);
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph'; ph.textContent = kind === 'video' ? 'видео' : 'фото';
      wrap.insertBefore(ph, wrap.firstChild);
    }
  }

  wrap._setPreview = setPreview; // чтобы видео-загрузчик мог подставить обложку в соседнее поле фото

  const doUpload = async (file) => {
    if (!file) return;
    clearError();
    const txt = wrap.querySelector('.txt');
    txt.textContent = kind === 'image' ? 'Сжимаю и загружаю…' : 'Загружаю…';
    // Пока файл готовится — «Сохранить» недоступна, иначе запись сохранилась бы без фото/видео
    const submitBtn = wrap.closest('form')?.querySelector('button[type="submit"]');
    if (submitBtn) submitBtn.disabled = true;
    try {
      let poster = null;
      // Фото с телефона весят 3–8 МБ — гость в меню ждал бы каждую карточку по несколько секунд.
      // Ужимаем прямо в браузере до разумного размера, ещё до отправки на сервер.
      if (kind === 'image') file = await compressImage(file, rawKey === 'bg_image' ? 2000 : 1280);
      if (kind === 'video') {
        txt.textContent = 'Готовлю видео… не закрывай и не переключай вкладку';
        const r = await transcodeVideo(file, { onProgress: (x) => { txt.textContent = `Готовлю видео… ${Math.round(x * 100)}% — не переключай вкладку`; } });
        file = r.file; poster = r.poster;
        if (r.frozen) toast('Этот браузер не смог перекодировать видео — загружаю как есть. Если не будет играть, попробуй загрузить из Chrome');
        txt.textContent = 'Загружаю…';
      }
      const form = new FormData();
      form.append('file', file);
      const res = await api(`/upload?restaurant=${state.slug}`, { method: 'POST', body: form, isForm: true });
      setPreview(res.url);

      // Обложка из первого кадра — если поле фото рядом пустое. Гость видит картинку сразу,
      // пока видео ещё грузится, и она же остаётся, если видео на его телефоне не заиграет.
      const posterKey = rawKey === 'video' ? 'image' : rawKey === 'bg_video' ? 'bg_image' : null;
      const posterInput = posterKey && document.getElementById('f_' + posterKey);
      if (poster && posterInput && !posterInput.dataset.url) {
        const pf = new FormData();
        pf.append('file', await compressImage(poster, 1280));
        const pr = await api(`/upload?restaurant=${state.slug}`, { method: 'POST', body: pf, isForm: true });
        document.getElementById('u_' + posterKey)?._setPreview?.(pr.url);
      }
      txt.textContent = 'Готово — перетащи новый файл, чтобы заменить';
    } catch (err) {
      showError('Не загрузилось: ' + err.message);
      toast('Не загрузилось: ' + err.message);
      txt.textContent = 'Перетащи файл сюда или нажми, чтобы выбрать';
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  };

  input.onchange = () => doUpload(input.files[0]);
  wrap.ondragover = (e) => { e.preventDefault(); wrap.classList.add('drag'); };
  wrap.ondragleave = () => wrap.classList.remove('drag');
  wrap.ondrop = (e) => { e.preventDefault(); wrap.classList.remove('drag'); doUpload(e.dataTransfer.files[0]); };
  wrap.querySelector('[data-clear]')?.addEventListener('click', (e) => { e.preventDefault(); setPreview(''); });

  if (urlInput) {

   Формат файла — один лист, колонки:

   Описание (рус) | Описание (қаз) | Описание (англ) | Цена | Варианты | Фото (ссылка)
   Варианты — как в остальном проекте: "30 мл:850 | 60 мл:950"
   ========================================================= */
const IMPORT_TEMPLATE_ROWS = [
  { 'Категория': 'Барное меню', 'Раздел': 'Классический кофе', 'Блюдо (рус)': 'Эспрессо', 'Блюдо (қаз)': '', 'Блюдо (англ)': 'Espresso',
    'Описание (рус)': 'Крепкий кофе с балансом кислинки и сладости', 'Описание (қаз)': '', 'Описание (англ)': '',
    'Цена': '', 'Варианты': '30 мл:850 | 60 мл:950', 'Фото (ссылка)': '' },
  { 'Категория': 'Основное меню', 'Раздел': 'Горячие блюда', 'Блюдо (рус)': 'Стейк рибай', 'Блюдо (қаз)': '', 'Блюдо (англ)': 'Ribeye steak',
    'Описание (рус)': 'Мраморная говядина, 300 г', 'Описание (қаз)': '', 'Описание (англ)': '',
    'Цена': 7900, 'Варианты': '', 'Фото (ссылка)': '' }
];

function downloadImportTemplate() {
  const ws = XLSX.utils.json_to_sheet(IMPORT_TEMPLATE_ROWS);
  ws['!cols'] = [{ wch: 16 }, { wch: 18 }, { wch: 20 }, { wch: 16 }, { wch: 16 }, { wch: 30 }, { wch: 16 }, { wch: 16 }, { wch: 8 }, { wch: 22 }, { wch: 20 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Меню');
  XLSX.writeFile(wb, 'шаблон-меню.xlsx');
}

/** "30 мл:850 | 60 мл:950" → [{label,price}] — тот же формат, что везде в проекте */
function parseVariantsStr(s) {
  return String(s || '').split('|').map((x) => x.trim()).filter(Boolean).map((x) => {
    const i = x.lastIndexOf(':');
    return i < 0 ? { label: '', price: Number(x) || 0 } : { label: x.slice(0, i).trim(), price: Number(x.slice(i + 1)) || 0 };
  });
}

async function runImport() {
  const fileInput = document.getElementById('importFile');
  const statusEl = document.getElementById('importStatus');
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = 'Сначала выбери файл.'; return; }

  statusEl.textContent = 'Читаю файл…';
  let rows;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  } catch (err) {
    statusEl.textContent = 'Не получилось прочитать файл: ' + err.message;
    return;
  }
  if (!rows.length) { statusEl.textContent = 'В файле нет строк с данными.'; return; }

  const catCache = new Map(state.categories.map((c) => [c.title_ru.trim().toLowerCase(), c.id]));
  // ВАЖНО: ответ /admin/api/sections отдаёт колонку как category_id (как в базе), а не
  // camelCase categoryId — раньше тут стояло s.categoryId, которое всегда undefined,
  // из-за чего повторный прогон импорта никогда не находил уже существующий раздел
  // и плодил новые дубли при каждом запуске.
  const secCache = new Map(state.sections.map((s) => [`${s.category_id}|${s.title_ru.trim().toLowerCase()}`, s.id]));
  // То же самое для блюд — раньше дублей вообще никак не проверяли, блюдо создавалось заново при каждом прогоне
  const itemCache = new Map(state.menuItems.map((it) => [`${it.section_id}|${it.title_ru.trim().toLowerCase()}`, it.id]));
  let nCat = 0, nSec = 0, nItem = 0, nUpdated = 0, sort = state.menuItems.length;
  const errors = [];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const catName = String(row['Категория'] || '').trim();
    const secName = String(row['Раздел'] || '').trim();
    const title = String(row['Блюдо (рус)'] || '').trim();
    if (!catName && !secName && !title) continue; // пустая строка — пропускаем молча
    if (!catName || !secName || !title) { errors.push(`Строка ${i + 2}: не заполнены Категория / Раздел / Блюдо (рус)`); continue; }

    statusEl.textContent = `Импортирую… блюдо ${i + 1} из ${rows.length}`;
    try {
      let catId = catCache.get(catName.toLowerCase());
      if (!catId) {
        const r = await api(`/categories?restaurant=${state.slug}`, { method: 'POST', body: { title_ru: catName, sort: catCache.size } });
        catId = r.id; catCache.set(catName.toLowerCase(), catId); nCat++;
      }
      const secKey = `${catId}|${secName.toLowerCase()}`;
      let secId = secCache.get(secKey);
      if (!secId) {
        const r = await api(`/sections?restaurant=${state.slug}`, { method: 'POST', body: { category_id: catId, title_ru: secName, sort: secCache.size } });
        secId = r.id; secCache.set(secKey, secId); nSec++;
      }

      const variants = parseVariantsStr(row['Варианты']);
      const payload = {
        section_id: secId, sort: sort++,
        title_ru: title, title_kk: String(row['Блюдо (қаз)'] || ''), title_en: String(row['Блюдо (англ)'] || ''),
        description_ru: String(row['Описание (рус)'] || ''), description_kk: String(row['Описание (қаз)'] || ''), description_en: String(row['Описание (англ)'] || ''),
        image: String(row['Фото (ссылка)'] || ''),
        variants: variants.length ? JSON.stringify(variants) : '',
        price: variants.length ? 0 : (Number(row['Цена']) || 0)
      };
      // Блюдо с таким названием уже есть в этом разделе — обновляем его, а не плодим копию.
      // Так повторный прогон того же файла (например, если файл поправили и перезалили) безопасен.
      const itemKey = `${secId}|${title.toLowerCase()}`;
      const existingId = itemCache.get(itemKey);
      if (existingId) {
        await api(`/menu-items/${existingId}?restaurant=${state.slug}`, { method: 'PUT', body: payload });
        nUpdated++;
      } else {
        const r = await api(`/menu-items?restaurant=${state.slug}`, { method: 'POST', body: payload });
        itemCache.set(itemKey, r.id);
        nItem++;
      }
    } catch (err) {
      errors.push(`Строка ${i + 2} («${title}»): ${err.message}`);
    }
  }

  await reloadTable('categories', 'categories');
  await reloadTable('sections', 'sections');
  await reloadTable('menuItems', 'menu-items');
  renderTab();

  statusEl.textContent = `Готово: ${nCat} новых категорий, ${nSec} новых разделов, ${nItem} блюд добавлено, ${nUpdated} обновлено.`
    + (errors.length ? `\n\nНе удалось (${errors.length}):\n` + errors.join('\n') : '');
}

/** Официальная кнопка Telegram: после подтверждения Telegram сам вернёт человека на /cabinet/tg/widget/<mode> */
function tgWidget(el, bot, mode) {
  if (!el) return;

  sc.src = 'https://telegram.org/js/telegram-widget.js?22';
  sc.setAttribute('data-telegram-login', bot);

  el.innerHTML = '';
  el.append(sc);
}

async function startQrLogin(box) {
  let stop = false;
  const draw = async () => {
    let j;
    try { j = await api('/qr/new', { method: 'POST' }); } catch { box.textContent = 'QR не загрузился, обновите страницу'; return; }
    box.innerHTML = '';
    new QRCode(box, { text: `${location.origin}/cabinet?qr=${j.id}`, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    const until = Date.now() + (j.ttl - 5) * 1000;
    while (!stop && Date.now() < until) {
      await new Promise((r) => setTimeout(r, 2000));
      const r = await api('/qr/poll', { method: 'POST', body: { id: j.id, secret: j.secret } }).catch(() => ({ status: 'pending' }));
      if (r.status === 'ok') { stop = true; location.href = '/cabinet'; return; }
      if (r.status === 'expired') break;
    }
    if (!stop) draw();
  };
  draw();
}

/** Стоп-лист: кухня и бар выключают закончившиеся блюда одним касанием */
function renderStopTab(c) {
  const secs = state.sections.slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
  const bySec = (id) => state.menuItems.filter((x) => String(x.section_id) === String(id)).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  const orphan = state.menuItems.filter((x) => !secs.some((s0) => String(s0.id) === String(x.section_id)));
  const off = state.menuItems.filter((x) => !x.active).length;
  const group = (title, list) => list.length ? `<h3 class="stop__sec">${esc(title)}</h3>${list.map((x) => `
      <label class="stop__row ${x.active ? '' : 'is-off'}"><span>${esc(x.title_ru || 'Без названия')}</span>
        <input type="checkbox" data-id="${x.id}" ${x.active ? 'checked' : ''}><i class="stop__sw"></i></label>`).join('')}` : '';
  c.innerHTML = `<div class="panel">
    <div class="panel-head"><h2>Стоп-лист</h2></div>
    <p class="hint" style="margin-bottom:10px">Блюдо закончилось — выключите его, и гости сразу перестанут его видеть. ${off ? `Сейчас выключено: <b>${off}</b>.` : ''}</p>
    <input type="search" class="stop__find" placeholder="Найти блюдо" id="stopFind">
    <div id="stopList">${state.menuItems.length ? secs.map((s0) => group(s0.title_ru, bySec(s0.id))).join('') + group('Без раздела', orphan)
      : '<p class="hint">В меню пока нет своих блюд.</p>'}</div></div>`;
  c.querySelector('#stopFind').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    c.querySelectorAll('.stop__row').forEach((r) => { r.hidden = q && !r.textContent.toLowerCase().includes(q); });
  };
  c.querySelectorAll('.stop__row input').forEach((inp) => inp.onchange = async () => {
    const it = state.menuItems.find((x) => String(x.id) === inp.dataset.id);
    try {
      await api(`/menu-items/${inp.dataset.id}?restaurant=${state.slug}`, { method: 'PUT', body: { active: inp.checked } });
      it.active = inp.checked ? 1 : 0;
      inp.closest('.stop__row').classList.toggle('is-off', !inp.checked);
      toast(inp.checked ? 'Блюдо снова в меню' : 'Блюдо скрыто от гостей');
    } catch (er) { inp.checked = !inp.checked; toast(er.message); }
  });
}

/* =========================================================
   ПУЛЬТ ПЛАТФОРМЫ (только владелец сервиса): все заведения, статусы, цифры
   ========================================================= */
const PLAN_PRICE = { domain: 240000, path: 144000 };
let platFilter = 'all', platQuery = '';
function fmtNum(n) { return Number(n || 0).toLocaleString('ru-RU'); }
function restStatus(r) {
  if (!r.active) return { key: 'off', text: 'Выключено', cls: 'st-off' };
  if (r.plan === 'test') return { key: 'test', text: 'Тестовое', cls: 'st-off' };
  if (r.plan === 'trial') {
    const left = r.trial_until ? Math.ceil((Date.parse(r.trial_until) - Date.now()) / 864e5) : 0;
    return left > 0 ? { key: 'trial', text: `Пробный · ${left} ${daysWord(left)}`, cls: 'st-trial' } : { key: 'expired', text: 'Пробный истёк', cls: 'st-exp' };
  }
  return { key: 'paid', text: 'Платит', cls: 'st-paid' };
}
function restUrl(r) { return r.domain ? `https://${r.domain}` : `${DEMO_ORIGIN}/${r.slug}`; }

async function renderPlatformTab(c) {
  c.innerHTML = '<p class="hint">Загружаю платформу…</p>';
  let d;
  try { d = await api('/platform'); } catch (er) { c.innerHTML = `<p class="hint">${esc(er.message)}</p>`; return; }
  // Тестовые и выключенные — в конце списка
  const rank = { expired: 0, trial: 1, paid: 2, test: 3, off: 4 };
  const rs = d.restaurants.map((r) => ({ ...r, st: restStatus(r) })).sort((a, b) => rank[a.st.key] - rank[b.st.key]);
  const paid = rs.filter((r) => r.st.key === 'paid');
  const trial = rs.filter((r) => r.st.key === 'trial');
  const expired = rs.filter((r) => r.st.key === 'expired');
  const tests = rs.filter((r) => r.st.key === 'test' || r.st.key === 'off');
  const revenue = paid.reduce((sum, r) => sum + (r.domain ? PLAN_PRICE.domain : PLAN_PRICE.path), 0);
  const guests = rs.reduce((sum, r) => sum + (r.guests7 || 0), 0);
  const kpis = [
    ['Заведений', rs.length - tests.length, `${paid.length} платят · ${trial.length} на пробном${tests.length ? ` · ${tests.length} тестовых` : ''}`],
    ['Доход в год', fmtNum(revenue) + ' ₸', 'оценка по тарифам 144 / 240 тыс.'],
    ['Пробный период', trial.length, expired.length ? `ещё ${expired.length} истекли — пора звонить` : 'истёкших нет'],
    ['Лиды за 7 дней', d.leads7, `всего ${d.leadsAll}`],
    ['Гостей за 7 дней', fmtNum(guests), 'открыли меню во всех заведениях']
  ];
  const filters = [['all', 'Все', rs.length], ['paid', 'Платят', paid.length], ['trial', 'Пробные', trial.length], ['expired', 'Истекли', expired.length], ...(tests.length ? [['test', 'Тестовые', tests.length]] : [])];
  const list = () => rs.filter((r) => (platFilter === 'all' || r.st.key === platFilter || (platFilter === 'test' && r.st.key === 'off'))
    && (!platQuery || (r.name + ' ' + r.slug + ' ' + (r.domain || '')).toLowerCase().includes(platQuery)));
  const rowHTML = (r) => {
    const wa = r.phone ? String(r.phone).replace(/\D/g, '').replace(/^8/, '7') : '';
    return `<div class="pl-row" data-slug="${esc(r.slug)}">
      <div class="pl-ava">${r.logo_header ? `<img src="${esc(r.logo_header)}" alt="">` : esc((r.name || '?').trim().charAt(0).toUpperCase())}</div>
      <div class="pl-main">
        <div class="pl-name"><b>${esc(r.name)}</b><span class="pl-st ${r.st.cls}">${r.st.text}</span></div>
        <a class="pl-url" href="${esc(restUrl(r))}" target="_blank" rel="noopener">${esc(restUrl(r).replace(/^https?:\/\//, ''))}</a>
        <div class="pl-nums"><span><b>${fmtNum(r.items)}</b> блюд</span><span><b>${fmtNum(r.guests7)}</b> гостей за 7 дн.</span><span><b>${fmtNum(r.orders7)}</b> заказов</span><span><b>${r.team || 0}</b> в команде</span></div>
      </div>
      <div class="pl-act">
        <button class="btn btn-dark btn-sm" data-open>Открыть</button>
        ${r.plan === 'trial' && r.lead_slug ? '<button class="btn btn-outline btn-sm" data-activate>✓ Оплатил</button><button class="btn btn-outline btn-sm" data-extend>+7 дней</button>' : ''}
        ${wa ? `<a class="btn btn-outline btn-sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
      </div>
    </div>`;
  };
  c.innerHTML = `
    <div class="pl-kpis">${kpis.map(([t, v, h]) => `<div class="pl-kpi"><p>${t}</p><b>${typeof v === 'number' ? fmtNum(v) : v}</b><small>${esc(h)}</small></div>`).join('')}</div>
    <div class="panel">
      <div class="pl-tools">
        <div class="pl-filters">${filters.map(([k, t, n]) => `<button class="chip-f ${platFilter === k ? 'on' : ''}" data-f="${k}">${t} <span>${n}</span></button>`).join('')}</div>
        <input type="search" class="pl-search" placeholder="Найти заведение" value="${esc(platQuery)}">
      </div>
      <div class="pl-list"></div>
    </div>`;
  const listEl = c.querySelector('.pl-list');
  const draw = () => {
    const items = list();
    listEl.innerHTML = items.length ? items.map(rowHTML).join('') : '<p class="hint" style="padding:16px 0">Ничего не найдено</p>';
    listEl.querySelectorAll('.pl-row').forEach((row) => {
      const r = rs.find((x) => x.slug === row.dataset.slug);
      row.querySelector('[data-open]').onclick = async () => {
        const sel = document.getElementById('restaurantSelect');
        if (![...sel.options].some((o) => o.value === r.slug)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(r.slug)}">${esc(r.name)} (${esc(r.slug)})</option>`);
        sel.value = r.slug; state.tab = 'stats';
        await selectRestaurant(r.slug); window.scrollTo(0, 0);
      };
      const act = row.querySelector('[data-activate]');
      if (act) act.onclick = () => { if (confirm(`«${r.name}» оплатил? Меню станет постоянным.`)) api(`/leads/${r.lead_slug}/activate`, { method: 'POST' }).then(() => { toast('Подключено'); renderPlatformTab(c); }).catch((er) => toast(er.message)); };
      const ext = row.querySelector('[data-extend]');
      if (ext) ext.onclick = () => api(`/leads/${r.lead_slug}/extend`, { method: 'POST' }).then(() => { toast('Пробный период продлён на 7 дней'); renderPlatformTab(c); }).catch((er) => toast(er.message));
    });
  };
  c.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { platFilter = b.dataset.f; c.querySelectorAll('[data-f]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
  c.querySelector('.pl-search').oninput = (e) => { platQuery = e.target.value.trim().toLowerCase(); draw(); };
  draw();
}

init();
</script>
</body>
</html>
